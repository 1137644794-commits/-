name: CI

# push 任意分支、任意 PR 都自动跑（测试设计文档 §6.2）
on: [push, pull_request]

jobs:
  test:
    name: pytest + 覆盖率门槛
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 测试环境完全隔离（SQLite + fakeredis + Celery eager），
      # 无需在 CI 里拉 MySQL/Redis 服务
      - name: 运行测试（总覆盖率低于 80% 视为失败）
        run: |
          pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80

  lint:
    name: ruff 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

      - name: ruff format 校验
        run: ruff format --check .